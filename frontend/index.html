<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSEvents | Агрегатор мероприятий</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">HSEvents 🎓</div>
        <nav class="nav">
            <a href="#" id="loginBtn">Войти</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="calendar-section">
            <h2>Календарь</h2>
            <div id="calendar-container">
                <!-- Сюда с помощью JS добавим интерактивный календарь -->
            </div>
        </section>

        <section class="events-section">
            <h2>Ближайшие мероприятия</h2>
            <div id="events-list">
                <!-- Карточки мероприятий будут загружаться сервером сюда -->
                <p>Загрузка мероприятий...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
